<form>
  <div [hidden]="ajout">
    <label>ID Model</label>
    <input type="text" [(ngModel)]="categorie.idCat" name="idCategorie"
           class="form-control w-25" readonly>
  </div>

  <div>
    <label>Nom Model</label>
    <input type="text" [(ngModel)]="categorie.nomCat" name="nomCategorie"
           class="form-control" placeholder="Entrez un nom de Model...">
  </div>

  <div class="mt-2">
    <button type="submit" [disabled]="!categorie.nomCat" class="btn btn-success"
            (click)="saveCategorie()">{{ ajout ? 'Ajouter' : 'Modifier' }}</button>
  </div>
</form>
