<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">

      <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
        <app-update-categorie
          [categorie]="updatedCat"
          (categorieUpdated)="categorieUpdated($event)"
          [ajout]="ajout">
        </app-update-categorie>

        @if (!ajout) {
          <button type="button" class="btn btn-secondary btn-sm mt-2" (click)="annuler()">
            Annuler la modification
          </button>
        }
      </div>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom Model</th>
            @if (authService.isAdmin()) {
              <th>Action</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (cat of categories(); track cat.idCat) {
            <tr>
              <td>{{ cat.idCat }}</td>
              <td>{{ cat.nomCat }}</td>
              @if (authService.isAdmin()) {
                <td><a class="btn btn-success" (click)="updateCat(cat)">Editer</a></td>
              }
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="text-center py-3">Aucune Model.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
