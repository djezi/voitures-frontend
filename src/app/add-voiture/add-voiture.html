<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <h2 class="mb-3">Ajouter une voiture</h2>

      <form>
        <div class="mb-3">
          <label class="form-label">ID Voiture</label>
          <input type="number" name="idVoiture" class="form-control"
                 [(ngModel)]="newVoiture.idVoiture">
        </div>

        <div class="mb-3">
          <label class="form-label">Nom Voiture</label>
          <input type="text" name="nomVoiture" class="form-control"
                 [(ngModel)]="newVoiture.nomVoiture">
        </div>

        <div class="mb-3">
          <label class="form-label">Prix Voiture</label>
          <input type="number" name="prixVoiture" class="form-control"
                 [(ngModel)]="newVoiture.prixVoiture">
        </div>

        <div class="mb-3">
          <label class="form-label">Date Création</label>
          <input type="date" name="dateCreation" class="form-control"
                 [(ngModel)]="newVoiture.dateCreation">
        </div>

        <div class="mb-3">
          <label class="form-label">Catégorie</label>
          <select name="idCategorie" class="form-select" [(ngModel)]="newIdCat">
            @for (cat of categories; track cat.idCat) {
              <option [ngValue]="cat.idCat">{{ cat.nomCat }}</option>
            }
          </select>
        </div>

        <button type="button" class="btn btn-primary" (click)="addVoiture()">Ajouter</button>
      </form>
    </div>
  </div>
</div>
