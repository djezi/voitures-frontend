<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <h2 class="mb-3">Modifier la voiture</h2>

      <form>
        <div class="mb-3">
          <label class="form-label">ID Voiture</label>
          <input type="number" name="idVoiture" class="form-control" readonly
                 [(ngModel)]="currentVoiture().idVoiture">
        </div>

        <div class="mb-3">
          <label class="form-label">Nom Voiture</label>
          <input type="text" name="nomVoiture" class="form-control"
                 [(ngModel)]="currentVoiture().nomVoiture">
        </div>

        <div class="mb-3">
          <label class="form-label">Prix Voiture</label>
          <input type="number" name="prixVoiture" class="form-control"
                 [(ngModel)]="currentVoiture().prixVoiture">
        </div>

        <div class="mb-3">
          <label class="form-label">Date Création</label>
          <input type="date" name="dateCreation" class="form-control"
                 [ngModel]="currentVoiture().dateCreation | date:'yyyy-MM-dd'"
                 (ngModelChange)="currentVoiture().dateCreation = $event">
        </div>

        <div class="mb-3">
          <label class="form-label">Model</label>
          <select name="idCategorie" class="form-select" [(ngModel)]="updatedCatId">
            @for (cat of categories(); track cat.idCat) {
              <option [ngValue]="cat.idCat">{{ cat.nomCat }}</option>
            }
          </select>
        </div>

        <button type="button" class="btn btn-primary" (click)="onUpdateVoiture()">Modifier</button>
      </form>
    </div>
  </div>
</div>
