<div class="container mt-5">
  <div class="card shadow border-danger">
    <div class="card-body text-center py-5">
      <h1 class="text-danger mb-3">Accès refusé</h1>
      <p class="lead mb-4">Vous n'êtes pas autorisé à accéder à cette page.</p>

      @if (!authService.isloggedIn()) {
        <a class="btn btn-primary me-2" routerLink="/login">Se connecter</a>
      }
      <a class="btn btn-outline-secondary" routerLink="/voitures">Retour à la liste</a>
    </div>
  </div>
</div>
